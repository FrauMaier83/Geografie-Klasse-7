<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topographie Afrikas – Zuordnungsspiel</title>
<style>
:root{--bg:#e8eef1;--card:#fff;--ink:#16303a;--mute:#5a7079;--line:#c3d0d6;--navy:#1d3a5c;--yel:#ffe08a;--sel:#e3a21a;--set:#5b8fb9;--ok:#2e7d4f;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10191d;--card:#1a272d;--ink:#e6eef1;--mute:#93a8b0;--line:#33464e;--navy:#3d6a9a;--set:#7fb1d6;--ok:#4caf78;--bad:#e5675a}}
:root[data-theme="dark"]{--bg:#10191d;--card:#1a272d;--ink:#e6eef1;--mute:#93a8b0;--line:#33464e;--navy:#3d6a9a;--set:#7fb1d6;--ok:#4caf78;--bad:#e5675a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1040px;margin:0 auto;padding:18px 14px 28px}
h1{font:700 1.65rem/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 14px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{padding:8px 14px;border:0;background:transparent;color:var(--ink);font:600 .95rem system-ui;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.mapwrap{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;container-type:inline-size}
.mapwrap img{display:block;width:100%;height:auto}
.pin{--p:clamp(22px,5.6cqw,34px);position:absolute;width:var(--p);height:var(--p);margin:calc(var(--p)/-2) 0 0 calc(var(--p)/-2);padding:0;border:2px solid #fff;border-radius:50%;background:var(--navy);color:#fff;font:700 clamp(10px,2.5cqw,14px) system-ui;cursor:pointer;display:none}
.pin.sq{border-radius:22%;background:var(--yel);color:#1d3a5c;border-color:#1d3a5c}
.pin.show{display:block}
.pin.set{background:var(--set)}.pin.sq.set{background:#ffd04d}
.pin.sel{box-shadow:0 0 0 4px rgba(227,162,26,.55);background:var(--sel);color:#16303a}
.pin.ok{background:var(--ok);color:#fff;border-color:#fff}.pin.bad{background:var(--bad);color:#fff;border-color:#fff}
.game{display:grid;grid-template-columns:minmax(0,560px) 1fr;gap:20px;align-items:start}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:2px}
#hint{min-height:1.5em;margin:0 0 8px;font-weight:600}
.tray{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.92rem;cursor:pointer;text-align:left}
.chip b{display:none;min-width:22px;height:22px;padding:0 4px;border-radius:11px;background:var(--set);color:#fff;font-size:.8rem;align-items:center;justify-content:center}
.chip.used b{display:inline-flex}
.chip.sel{border-color:var(--sel);box-shadow:0 0 0 3px rgba(227,162,26,.4)}
.chip.ok{border-color:var(--ok)}.chip.ok b{background:var(--ok)}
.chip.bad{border-color:var(--bad)}.chip.bad b{background:var(--bad)}
@media (max-width:820px){.game{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:4;order:-1;max-height:34vh;background:var(--bg);padding:6px 0 8px;margin-bottom:8px;border-bottom:1px solid var(--line)}.tray{gap:6px}.chip{padding:5px 8px;font-size:.85rem}}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn{padding:10px 16px;border-radius:8px;border:0;background:var(--ink);color:var(--bg);font:600 1rem system-ui;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
#score{font-weight:600;margin-right:auto}
#msg{margin:10px 0 0;min-height:2.6em}
button:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
</style></head><body><main>

nums.concat(lets).forEach(k=>{const b=document.createElement("button");const isN=!isNaN(k);b.className="pin"+(isN?"":" sq");b.style.left=POS[k][0]+"%";b.style.top=POS[k][1]+"%";const i=isN?+k-1:k.charCodeAt(0)-65;b.onclick=()=>pickPin(i);map.appendChild(b);pins[isN?"n":"l"][i]=b});
function buildTray(){tray.innerHTML="";chips.length=0;CATS[cat].names.map((t,j)=>[t,j]).sort((a,b)=>a[0].localeCompare(b[0],"de")).forEach(([t,j])=>{const b=document.createElement("button");b.className="chip";b.innerHTML="<span></span><b></b>";b.firstChild.textContent=t;b.onclick=()=>pickChip(j);tray.appendChild(b);chips[j]=b})}
const owner=(s,j)=>Object.keys(s.A).find(k=>s.A[k]==j);
function pickPin(i){const s=S[cat];clear();if(s.A[i]!==undefined){delete s.A[i];selN=selM=null;return draw()}if(selM!==null){s.A[i]=selM;selN=selM=null}else selN=(selN===i?null:i);draw()}
function pickChip(j){const s=S[cat];clear();const p=owner(s,j);if(p!==undefined){delete s.A[p];selN=selM=null;return draw()}if(selN!==null){s.A[selN]=j;selN=selM=null}else selM=(selM===j?null:j);draw()}
function clear(){if(checked){checked=false;msg.textContent=""}}
function draw(){const C=CATS[cat],s=S[cat],show=checked||practice;["n","l"].forEach(t=>pins[t].forEach(p=>p.classList.remove("show","sel","set","ok","bad")));
pins[C.pins].forEach((p,i)=>{p.classList.add("show");p.textContent=s.L[i];p.setAttribute("aria-label","Markierung "+s.L[i]);if(s.A[i]!==undefined){p.classList.add("set");if(show)p.classList.add(s.A[i]==i?"ok":"bad")}if(selN===i)p.classList.add("sel")});
chips.forEach((c,j)=>{const p=owner(s,j);c.className="chip"+(p!==undefined?" used":"")+(selM===j?" sel":"");c.querySelector("b").textContent=p!==undefined?s.L[p]:"";if(show&&p!==undefined)c.classList.add(p==j?"ok":"bad")});
const k=Object.keys(s.A),r=k.filter(x=>s.A[x]==x).length;sc.textContent=practice&&k.length?r+" von "+k.length+" richtig":k.length+" von "+C.n+" zugeordnet";
hint.textContent=cat=="cap"?(selN!==null?N[selN]+" (Nr. "+s.L[selN]+") – welche Hauptstadt?":selM!==null?"Tippe jetzt eine Zahl auf der Karte an. Das Land erscheint hier.":"Tippe eine Zahl an: Hier erscheint das Land, dessen Hauptstadt du suchst."):selN!==null?"Markierung "+s.L[selN]+" gewählt – tippe jetzt den Namen an.":selM!==null?"Tippe jetzt die passende Markierung auf der Karte an.":"";
if(practice&&r==C.n)msg.textContent="Alles richtig – sehr gut!"}
document.getElementById("check").onclick=()=>{const C=CATS[cat],s=S[cat];checked=true;const k=Object.keys(s.A),r=k.filter(x=>s.A[x]==x).length;draw();
msg.textContent=k.length<C.n?r+" von "+k.length+" gesetzten Zuordnungen stimmen. Es fehlen noch "+(C.n-k.length)+".":r==C.n?"Alles richtig – sehr gut!":r+" von "+C.n+" richtig. Rote Markierungen kannst du antippen und neu zuordnen."};
document.getElementById("reset").onclick=()=>{fresh(cat);selN=selM=null;checked=false;msg.textContent="";draw()};
document.querySelectorAll("#cat button").forEach(b=>b.onclick=()=>{cat=b.dataset.c;selN=selM=null;checked=false;msg.textContent="";document.querySelectorAll("#cat button").forEach(x=>x.classList.toggle("on",x==b));buildTray();draw()});
document.querySelectorAll("#mode button").forEach(b=>b.onclick=()=>{practice=b.dataset.m=="practice";checked=false;msg.textContent="";document.getElementById("check").hidden=practice;document.querySelectorAll("#mode button").forEach(x=>x.classList.toggle("on",x==b));draw()});
buildTray();draw();
</script></body></html>
